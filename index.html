<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南瓜驚魂夜</title>
<style>
  :root{
    --bg-deep:#0d0a16;
    --bg-mid:#1c1430;
    --cabinet:#2a2138;
    --cabinet-edge:#463a5c;
    --ground:#241a16;
    --pumpkin:#ff8f1f;
    --pumpkin-dark:#c2540a;
    --blood:#a3162a;
    --moon:#f3e9c9;
    --ecto:#7ee8b8;
    --ink:#0d0a16;
    --parchment:#f2e8d5;
    --parchment-dim:#c9bfa8;
    --danger:#ff4d4d;
    --gap:14px;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg-deep);
    color:var(--parchment);
    min-height:100vh;
    padding:20px 16px 32px;
    display:flex;
    justify-content:center;
    font-family:'VT323','Courier New',monospace;
  }

  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:10px;}

  .marquee{
    width:100%;
    text-align:center;
    padding:12px 10px 10px;
    background:linear-gradient(180deg,var(--cabinet) 0%,var(--bg-mid) 100%);
    border:3px solid var(--cabinet-edge);
    border-bottom:none;
  }
  .marquee h1{
    margin:0;
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:clamp(16px,4.6vw,26px);
    color:var(--pumpkin);
    text-shadow:0 0 10px rgba(255,143,31,.55), 2px 2px 0 #4a1600;
    letter-spacing:1px;
    text-wrap:balance;
  }
  .marquee p{
    margin:6px 0 0;
    font-size:15px;
    color:var(--ecto);
    letter-spacing:3px;
  }

  .hud{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:8px 10px;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:var(--bg-mid);
    border-left:3px solid var(--cabinet-edge);
    border-right:3px solid var(--cabinet-edge);
    font-size:16px;
  }
  .hud .stat{display:flex;gap:6px;align-items:baseline;}
  .hud .stat b{
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:12px;
    color:var(--pumpkin);
  }
  .hud .stat span{font-variant-numeric:tabular-nums;color:var(--parchment);}
  #muteBtn, #pauseBtn, #homeBtn{
    font-family:'VT323',monospace;
    font-size:15px;
    background:var(--cabinet);
    color:var(--ecto);
    border:2px solid var(--cabinet-edge);
    padding:4px 10px;
    cursor:pointer;
  }
  #muteBtn:hover, #pauseBtn:hover, #homeBtn:hover{background:var(--cabinet-edge);}
  #muteBtn:focus-visible, #pauseBtn:focus-visible, #homeBtn:focus-visible, button:focus-visible{outline:2px solid var(--ecto);outline-offset:2px;}

  .screen{
    position:relative;
    width:100%;
    aspect-ratio:256/160;
    background:#000;
    border:3px solid var(--cabinet-edge);
    border-top:none;
    overflow:hidden;
  }
  #game{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    cursor:pointer;
  }
  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0px,rgba(0,0,0,.16) 1px,transparent 2px,transparent 3px);
    mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 40px 10px rgba(0,0,0,.6);
  }

  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;
    text-align:center;
    padding:16px;
    background:rgba(9,7,15,.86);
  }
  .overlay[hidden]{display:none!important;}
  .overlay h2{
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:clamp(14px,5vw,22px);
    color:var(--pumpkin);
    margin:0;
    text-shadow:2px 2px 0 #3a1200;
    text-wrap:balance;
  }
  .overlay p{margin:0;font-size:16px;color:var(--parchment-dim);max-width:34ch;}
  .overlay .best{font-size:15px;color:var(--ecto);}
  .bigbtn{
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:13px;
    color:var(--ink);
    background:var(--pumpkin);
    border:3px solid #7a3e00;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:0 4px 0 #7a3e00;
  }
  .bigbtn:active{transform:translateY(3px);box-shadow:none;}
  .bigbtn:hover{background:#ffa646;}

  #levelBanner h2{font-size:clamp(20px,7vw,34px);}
  #levelBanner p{color:var(--ecto);font-size:17px;}

  #retryBanner h2{color:var(--danger);}

  .jumpscare{
    position:fixed;inset:0;
    z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    opacity:0;
    pointer-events:none;
  }
  .jumpscare[hidden]{display:none!important;}
  .jumpscare.show{
    opacity:1;
    animation:scarePop .55s cubic-bezier(.2,1.4,.4,1) both, shake .5s linear .05s both;
  }
  #scareImg{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    filter:contrast(1.15) saturate(1.05);
  }
  @keyframes scarePop{0%{transform:scale(.4);}55%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes shake{
    0%,100%{margin-left:0;}
    20%{margin-left:-8px;}
    40%{margin-left:7px;}
    60%{margin-left:-6px;}
    80%{margin-left:5px;}
  }
  @media (prefers-reduced-motion:reduce){
    .jumpscare.show{animation:scareFade .3s ease both;}
    @keyframes scareFade{from{opacity:0;}to{opacity:1;}}
  }

  #scareFallback{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    font-family:'Press Start 2P',monospace;
    color:#ff3030;
    text-align:center;
    text-shadow:0 0 14px #ff0000,0 0 34px #ff0000,3px 3px 0 #000;
  }
  #scareFallback[hidden]{display:none!important;}
  #scareFallback .scareEmoji{font-size:min(32vw,190px);line-height:1;filter:drop-shadow(0 0 22px #f00);}
  #scareFallback .scareText{font-size:clamp(28px,10vw,64px);letter-spacing:4px;}

  #glitchOverlay{
    position:fixed;inset:0;
    z-index:10001;
    width:100%;height:100%;
    background:#000;
    pointer-events:none;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  #glitchOverlay[hidden]{display:none!important;}

  #endScreen .stats{
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    font-size:16px;color:var(--parchment);
  }
  #endScreen .stats b{color:var(--pumpkin);font-variant-numeric:tabular-nums;}

  .legend{font-size:14px;color:var(--parchment-dim);}

  .lvlgrid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:290px;}
  .lvltile{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:11px;
    border:2px solid var(--cabinet-edge);
    background:var(--cabinet);
    color:var(--parchment-dim);
    cursor:pointer;
  }
  .lvltile:hover{background:var(--cabinet-edge);}
  .lvltile.cleared:hover{background:#ffa646;}
  .lvltile:focus-visible{outline:2px solid var(--ecto);outline-offset:2px;}
  .lvltile.cleared{
    background:var(--pumpkin);
    color:var(--ink);
    border-color:#7a3e00;
  }
  .lvltile.locked{opacity:.45;cursor:not-allowed;}
  .lvltile.locked:hover{background:var(--cabinet);}

  .tabs{display:flex;gap:8px;margin-top:2px;}
  .tabBtn{
    font-family:'Press Start 2P','Courier New',monospace;
    font-size:11px;
    background:var(--cabinet);
    color:var(--parchment-dim);
    border:2px solid var(--cabinet-edge);
    padding:8px 14px;
    cursor:pointer;
  }
  .tabBtn:hover{background:var(--cabinet-edge);}
  .tabBtn.active{background:var(--pumpkin);color:var(--ink);border-color:#7a3e00;}
  .tabBtn.active:hover{background:#ffa646;}

  #levelsPanel, #rankPanel{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
  #levelsPanel[hidden], #rankPanel[hidden]{display:none!important;}

  .nameRow{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--parchment-dim);flex-wrap:wrap;justify-content:center;}
  #playerNameInput{
    font-family:'VT323',monospace;
    font-size:16px;
    background:var(--bg-deep);
    color:var(--parchment);
    border:2px solid var(--cabinet-edge);
    padding:4px 8px;
    width:140px;
  }
  #playerNameInput:focus-visible{outline:2px solid var(--ecto);outline-offset:1px;}

  .rankTableWrap{width:100%;max-height:220px;overflow-y:auto;border:2px solid var(--cabinet-edge);}
  .rankTable{width:100%;border-collapse:collapse;font-size:14px;}
  .rankTable th, .rankTable td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--cabinet-edge);}
  .rankTable th{background:var(--cabinet);color:var(--pumpkin);font-family:'Press Start 2P','Courier New',monospace;font-size:9px;}
  .rankTable td{color:var(--parchment);}
  .rankTable tr:nth-child(even) td{background:rgba(255,255,255,0.03);}

  @media (max-width:420px){
    .hud{font-size:14px;}
    .marquee p{letter-spacing:1.5px;}
  }

  /* On the home/menu screen the content (tabs, name input, level grid,
     leaderboard...) is taller than the fixed 256:160 game viewport, so the
     viewport is allowed to grow to fit it instead of clipping the overflow. */
  .screen.homeMode{
    aspect-ratio:auto;
    overflow:visible;
    padding:0;
  }
  .screen.homeMode #startScreen{
    position:static;
    inset:auto;
  }
  .screen.homeMode #game,
  .screen.homeMode .scanlines,
  .screen.homeMode .vignette{
    display:none;
  }
</style>

</head>
<body>

<div class="wrap">
  <div class="marquee">
    <h1>南瓜驚魂夜</h1>
    <p>PUMPKIN FRIGHT NIGHT</p>
  </div>

  <div class="hud">
    <div class="stat"><b>關卡</b><span id="hudLevel">-/7</span></div>
    <div class="stat"><b>時間</b><span id="hudTime">--</span></div>
    <div class="stat"><b>本關</b><span id="hudScore">-</span></div>
    <div class="stat"><b>失誤</b><span id="hudMiss">0</span></div>
    <div class="stat"><b>總打中</b><span id="hudTotal">0</span></div>
    <button id="pauseBtn" type="button">暫停</button>
    <button id="homeBtn" type="button">主選單</button>
    <button id="muteBtn" type="button">音效:開</button>
  </div>

  <div class="screen homeMode" id="screenEl">
    <canvas id="game" width="256" height="160"></canvas>

    <div class="overlay" id="startScreen">
      <h2>南瓜驚魂夜</h2>
      <p>墓園裡的南瓜一隻一隻從土裡冒出來,點擊或點按它們把它們打回洞裡!挑戰全部 7 個關卡,但越後面越快、也越恐怖…</p>
      <div class="tabs">
        <button class="tabBtn active" id="tabLevelsBtn" type="button">關卡</button>
        <button class="tabBtn" id="tabRankBtn" type="button">排名</button>
      </div>
      <div id="levelsPanel">
        <label class="nameRow">玩家名稱:<input id="playerNameInput" type="text" maxlength="16" placeholder="輸入你的名字"></label>
        <p class="best" id="bestLine">尚無紀錄</p>
        <p class="legend" id="clearSummary">已通過 0 / 7 關</p>
        <div class="lvlgrid" id="lvlGrid"></div>
        <button class="bigbtn" id="startBtn" type="button">開始遊戲</button>
        <p class="legend">電腦用滑鼠點擊,手機/平板用手指點按</p>
      </div>
      <div id="rankPanel" hidden>
        <div class="rankTableWrap">
          <table class="rankTable" id="rankTable">
            <thead><tr><th>名次</th><th>玩家</th><th>最高關卡</th><th>南瓜數</th></tr></thead>
            <tbody id="rankTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="overlay" id="levelBanner" hidden>
      <h2 id="levelBannerTitle">LEVEL 1</h2>
      <p id="levelBannerSub"></p>
    </div>

    <div class="overlay" id="retryBanner" hidden>
      <h2>還差一點!</h2>
      <p id="retryText"></p>
    </div>

    <div class="overlay" id="pauseOverlay" hidden>
      <h2>已暫停</h2>
      <p>休息一下,準備好了再繼續!</p>
      <button class="bigbtn" id="resumeBtn" type="button">繼續遊戲</button>
    </div>

    <div class="jumpscare" id="jumpscare" hidden>
      <img id="scareImg" src="scare.jpg" alt="">
      <div id="scareFallback" hidden><div class="scareEmoji">💀</div><div class="scareText">BOO!</div></div>
    </div>
    <canvas id="glitchOverlay" hidden></canvas>

    <div class="overlay" id="endScreen" hidden>
      <h2>YOU ARE VERY GOOD!</h2>
      <p>你撐過了南瓜驚魂夜的所有試煉!</p>
      <div class="stats">
        <div>總共打中 <b id="endHits">0</b> 隻南瓜</div>
      </div>
      <p class="best" id="endBest"></p>
      <button class="bigbtn" id="restartBtn" type="button">再玩一次</button>
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   CONFIG
--------------------------------------------------------------- */
var W = 256, H = 160;
var LEVEL_TIME_MS = 20000; // fallback only; each level below sets its own timeMs
var INTRO_MS = 1500;
var RETRY_MS = 1600;
var LEVELS = [
  {n:1, upMs:950, gapMin:500, gapMax:800, timeMs:20000, mode:'score', threshold:8,  multi:false, retryOnFail:true, scary:false, falling:false, jumpscare:'none',      sub:'暖身一下,先打個 8 隻!'},
  {n:2, upMs:750, gapMin:400, gapMax:650, timeMs:20000, mode:'score', threshold:10, multi:false, retryOnFail:true, scary:false, falling:false, jumpscare:'none',      sub:'速度變快了,打到 10 隻!'},
  {n:3, upMs:600, gapMin:300, gapMax:500, timeMs:15000, mode:'score', threshold:17, multi:false, retryOnFail:true, scary:false, falling:false, jumpscare:'endOfLevel', sub:'速度又變快了,要打到 17 隻才能過關'},
  {n:4, upMs:750, gapMin:400, gapMax:650, timeMs:15000, mode:'score', threshold:15, multi:false, retryOnFail:true, scary:true,  falling:true,  jumpscare:'endOfLevel', sub:'南瓜們…好像哪裡不對勁,天上也開始掉南瓜了,要打到 15 隻才能過關'},
  {n:5, upMs:380, gapMin:150, gapMax:250, timeMs:15000, mode:'score', threshold:17, multi:false, retryOnFail:true, scary:true,  falling:true,  jumpscare:'endOfLevel', sub:'墓園更陰森了,小心天上掉下來的南瓜,要打到 17 隻才能過關'},
  {n:6, upMs:950, gapMin:500, gapMax:800, timeMs:15000, mode:'score', threshold:10, multi:false, retryOnFail:true, scary:true,  falling:true,  jumpscare:'every3miss', sub:'連續失手 3 次會被嚇一跳!小心天上的南瓜,要打到 10 隻才能過關'},
  {n:7, upMs:750, gapMin:400, gapMax:650, timeMs:15000, mode:'score', threshold:12, multi:false, retryOnFail:true, scary:true,  falling:true,  jumpscare:'every3miss', sub:'最終試煉:連續失手 3 次會被嚇一跳!天上也會掉南瓜,要打到 12 隻才能過關!'}
];
var FALL_TOP_Y = 14, FALL_BOTTOM_Y = 152;
var GRID_X = [43, 128, 213];
var GRID_Y = [104, 123, 142];
var HOLE_RX = 17, HOLE_RY = 7;
var RISE_MS = 130, LEAVE_MS = 150;

/* ---------------------------------------------------------------
   CANVAS
--------------------------------------------------------------- */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------------------------------------------------------
   AUDIO ENGINE (procedural, no external files)
--------------------------------------------------------------- */
var actx = null, masterGain = null, muted = false;
function ensureAudio(){
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.8;
  masterGain.connect(actx.destination);
}
function noteFreq(semi){ return 440 * Math.pow(2, semi/12); }

function tone(freq, dur, opts){
  if (!actx || muted) return;
  opts = opts || {};
  var type = opts.type || 'square';
  var gainVal = opts.gain==null ? 0.15 : opts.gain;
  var delay = opts.delay || 0;
  var detune = opts.detune || 0;
  var t0 = actx.currentTime + delay;
  var osc = actx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  osc.detune.value = detune;
  var g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(gainVal,0.001), t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g).connect(masterGain);
  osc.start(t0);
  osc.stop(t0+dur+0.05);
}

function noiseBurst(dur, opts){
  if (!actx || muted) return;
  opts = opts || {};
  var freqFrom = opts.freqFrom || 1800, freqTo = opts.freqTo || 90;
  var gainVal = opts.gain==null ? 0.4 : opts.gain;
  var bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
  var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  var src = actx.createBufferSource();
  src.buffer = buffer;
  var filter = actx.createBiquadFilter();
  filter.type = 'bandpass';
  var t0 = actx.currentTime;
  filter.frequency.setValueAtTime(freqFrom, t0);
  filter.frequency.exponentialRampToValueAtTime(Math.max(freqTo,20), t0+dur);
  filter.Q.value = 0.7;
  var g = actx.createGain();
  g.gain.setValueAtTime(gainVal, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(filter).connect(g).connect(masterGain);
  src.start(t0);
}

function noiseCrash(dur, opts){
  if (!actx || muted) return;
  opts = opts || {};
  var freqFrom = opts.freqFrom || 1200, freqTo = opts.freqTo || 5000;
  var gainVal = opts.gain==null ? 0.4 : opts.gain;
  var bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
  var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  var src = actx.createBufferSource();
  src.buffer = buffer;
  var filter = actx.createBiquadFilter();
  filter.type = 'highpass';
  var t0 = actx.currentTime;
  filter.frequency.setValueAtTime(freqFrom, t0);
  filter.frequency.exponentialRampToValueAtTime(freqTo, t0+dur*0.4);
  filter.Q.value = 0.8;
  var g = actx.createGain();
  g.gain.setValueAtTime(gainVal, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(filter).connect(g).connect(masterGain);
  src.start(t0);
}

function playHit(levelNum){
  if (levelNum <= 2){
    tone(noteFreq(14), 0.07, {type:'square', gain:0.16});
    tone(noteFreq(19), 0.09, {type:'square', gain:0.13, delay:0.045});
  } else {
    tone(noteFreq(2), 0.09, {type:'square', gain:0.15});
    tone(noteFreq(1), 0.12, {type:'sawtooth', gain:0.10, delay:0.05, detune:-25});
  }
}

function playJumpscareSound(){
  if (!actx || muted) return;
  var t0 = actx.currentTime;

  // --- explosion ---
  // sub-bass thump
  var boom = actx.createOscillator();
  boom.type = 'sine';
  boom.frequency.setValueAtTime(110, t0);
  boom.frequency.exponentialRampToValueAtTime(28, t0+0.35);
  var bg = actx.createGain();
  bg.gain.setValueAtTime(0.0001, t0);
  bg.gain.exponentialRampToValueAtTime(0.9, t0+0.012);
  bg.gain.exponentialRampToValueAtTime(0.0001, t0+0.45);
  boom.connect(bg).connect(masterGain);
  boom.start(t0); boom.stop(t0+0.5);
  // rumble/crack (low, descending)
  noiseBurst(0.4, {freqFrom:1000, freqTo:60, gain:0.7});

  // --- glass shattering ---
  // bright shimmering crash
  noiseCrash(0.4, {freqFrom:1200, freqTo:6000, gain:0.5});
  // scattered high-pitched shard "tinkles"
  for (var i=0;i<9;i++){
    var f = 1800 + Math.random()*3600;
    tone(f, 0.05+Math.random()*0.09, {type:'sine', gain:0.05+Math.random()*0.05, delay:0.02+Math.random()*0.28});
  }
}

function playPassChime(){

/* --- simple step-sequencer for background music --- */
var musicGen = 0, musicTimer = null;
function buildPattern(steps, bassNotes, leadNotes, bassType, leadType, bassGain, leadGain){
  var pat = [];
  for (var i=0;i<steps;i++) pat.push([]);
  bassNotes.forEach(function(n){ pat[n[0]].push({st:n[1], len:n[2], type:bassType, gain:bassGain}); });
  leadNotes.forEach(function(n){ pat[n[0]].push({st:n[1], len:n[2], type:leadType, gain:leadGain}); });
  return pat;
}
var TRACK_UPBEAT = buildPattern(16,
  [[0,-21,2],[2,-14,1],[4,-21,1],[6,-17,1],[8,-16,2],[11,-14,1],[12,-21,1],[14,-14,1]],
  [[0,3,1],[1,7,1],[2,10,1],[4,7,1],[6,3,1],[8,8,1],[9,12,1],[10,10,1],[12,3,1],[13,7,1],[14,10,1],[15,7,1]],
  'triangle','square',0.11,0.07);
var TRACK_EERIE = buildPattern(16,
  [[0,-22,4],[4,-21,4],[8,-24,4],[12,-22,4]],
  [[2,-9,1],[6,-8,1],[10,-9,1],[14,-3,2]],
  'sine','sawtooth',0.13,0.05);
var TRACK_VICTORY = buildPattern(8,
  [[0,-9,2],[2,-2,1],[4,-9,1],[6,-2,1]],
  [[0,3,1],[1,7,1],[2,10,1],[3,15,1],[4,10,1],[5,7,1],[6,3,1],[7,7,1]],
  'triangle','square',0.12,0.09);
var TRACK_HORROR = buildPattern(16,
  [[0,-26,4],[4,-25,2],[6,-26,2],[8,-28,4],[12,-25,2],[14,-26,2]],
  [[1,-13,1],[3,-14,1],[5,-13,1],[9,-19,1],[11,-13,1],[13,-14,1],[15,-19,1]],
  'sawtooth','square',0.14,0.06);

function playLoop(pattern, bpm){
  stopMusic();
  var gen = ++musicGen;
  var stepDur = 60/bpm/2;
  var i = 0;
  function step(){
    if (gen !== musicGen) return;
    var events = pattern[i % pattern.length];
    for (var k=0;k<events.length;k++){
      var note = events[k];
      tone(noteFreq(note.st), note.len*stepDur*0.85, {type:note.type, gain:note.gain});
    }
    i++;
    musicTimer = setTimeout(step, stepDur*1000);
  }
  step();
}
function stopMusic(){
  musicGen++;
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
}
function musicForLevel(levelNum){
  if (levelNum <= 2) { playLoop(TRACK_UPBEAT, 148); return; }
  if (levelNum === 3) { playLoop(TRACK_EERIE, 92); return; }
  var bpm = 100 + (levelNum-4)*12;
  playLoop(TRACK_HORROR, bpm);
}

function drawTombstone(c,x,y,w,h,dark){

function drawBat(c,x,y,phase){
  var flap = Math.sin(phase)*3;
  c.fillStyle = '#0a0812';
  c.beginPath();
  c.moveTo(x, y);
  c.quadraticCurveTo(x-7, y-6-flap, x-11, y-1);
  c.quadraticCurveTo(x-4, y-1, x, y+3);
  c.quadraticCurveTo(x+4, y-1, x+11, y-1);
  c.quadraticCurveTo(x+7, y-6-flap, x, y);

}

function drawPumpkin(c, cx, cy, scale, scary, big){
  c.save();
  c.translate(cx, cy);
  c.scale(scale, scale);

  var bodyW = big ? 96 : 30, bodyH = big ? 78 : 24;
  var mainColor = scary ? '#e0570f' : '#ff8f1f';
  var shadeColor = scary ? '#7c1a05' : '#c2540a';
  var hiColor = scary ? '#ff7a33' : '#ffb35c';

  // ridge lobes
  c.fillStyle = shadeColor;
  [-1,-0.45,0.1,0.62].forEach(function(f){
    c.beginPath();
    c.ellipse(f*bodyW*0.32, bodyH*0.06, bodyW*0.32, bodyH*0.46, 0, 0, Math.PI*2);
    c.fill();
  });
  c.fillStyle = mainColor;
  c.beginPath();
  c.ellipse(0, bodyH*0.08, bodyW*0.48, bodyH*0.42, 0, 0, Math.PI*2);
  c.fill();
  c.fillStyle = hiColor;
  c.globalAlpha = 0.5;
  c.beginPath();
  c.ellipse(-bodyW*0.16, -bodyH*0.12, bodyW*0.14, bodyH*0.18, 0, 0, Math.PI*2);
  c.fill();
  c.globalAlpha = 1;

  // stem
  c.fillStyle = scary ? '#2a3d1e' : '#4a7c3a';
  c.save();
  c.translate(0,-bodyH*0.42);
  c.rotate(scary ? -0.35 : -0.15);
  c.fillRect(-bodyW*0.06, -bodyH*0.22, bodyW*0.12, bodyH*0.26);
  c.restore();

  if (!scary){
    // cute round eyes
    c.fillStyle = '#160f08';
    c.beginPath(); c.arc(-bodyW*0.17, bodyH*0.0, bodyW*0.07, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(bodyW*0.17, bodyH*0.0, bodyW*0.07, 0, Math.PI*2); c.fill();
    // rosy cheeks
    c.fillStyle = 'rgba(255,120,140,0.55)';
    c.beginPath(); c.arc(-bodyW*0.30, bodyH*0.16, bodyW*0.06, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(bodyW*0.30, bodyH*0.16, bodyW*0.06, 0, Math.PI*2); c.fill();
    // smile
    c.strokeStyle = '#160f08';
    c.lineWidth = bodyW*0.045;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-bodyW*0.20, bodyH*0.20);
    c.quadraticCurveTo(0, bodyH*0.34, bodyW*0.20, bodyH*0.20);
    c.stroke();
  } else {
    // angry jagged brows
    c.strokeStyle = '#0d0704';
    c.lineWidth = bodyW*0.045;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(-bodyW*0.27,-bodyH*0.11); c.lineTo(-bodyW*0.08,-bodyH*0.03); c.stroke();
    c.beginPath(); c.moveTo(bodyW*0.27,-bodyH*0.11); c.lineTo(bodyW*0.08,-bodyH*0.03); c.stroke();
    // jagged eyes
    c.fillStyle = '#0d0704';
    [-1,1].forEach(function(s){
      c.beginPath();
      c.moveTo(s*bodyW*0.10, bodyH*0.02);
      c.lineTo(s*bodyW*0.22, -bodyH*0.02);
      c.lineTo(s*bodyW*0.22, bodyH*0.06);
      c.lineTo(s*bodyW*0.14, bodyH*0.10);
      c.closePath(); c.fill();
    });
    // blood drips
    c.fillStyle = '#8a0f1f';
    [-1,1].forEach(function(s){
      c.fillRect(s*bodyW*0.17-bodyW*0.02, bodyH*0.06, bodyW*0.04, bodyH*0.20);
      c.beginPath(); c.arc(s*bodyW*0.17, bodyH*0.28, bodyW*0.025,0,Math.PI*2); c.fill();
    });
    // jagged angry mouth with teeth
    c.fillStyle = '#0d0704';
    c.beginPath();
    c.moveTo(-bodyW*0.30, bodyH*0.22);
    c.lineTo(bodyW*0.30, bodyH*0.22);
    c.lineTo(bodyW*0.30, bodyH*0.30);
    for (var tI=5;tI>=-5;tI--){
      c.lineTo(tI*bodyW*0.06, bodyH*(tI%2===0?0.34:0.42));
    }
    c.lineTo(-bodyW*0.30, bodyH*0.30);
    c.closePath(); c.fill();
    c.fillStyle = '#e9e2d2';
    for (var tt=-4; tt<=4; tt+=2){
      c.beginPath();
      c.moveTo(tt*bodyW*0.06-bodyW*0.03, bodyH*0.24);
      c.lineTo(tt*bodyW*0.06+bodyW*0.03, bodyH*0.24);
      c.lineTo(tt*bodyW*0.06, bodyH*0.33);
      c.closePath(); c.fill();
    }
  }
  c.restore();
}

--------------------------------------------------------------- */
var clock = {pausedAccum:0, isPaused:false, pauseStart:0};
function now(){
  return clock.isPaused ? (clock.pauseStart - clock.pausedAccum) : (performance.now() - clock.pausedAccum);
}

var holes = GRID_X.reduce(function(acc,gx){
  GRID_Y.forEach(function(gy){ acc.push({x:gx,y:gy,up:false,hit:false,retractAt:0,leavingAt:-9999,nextSpawn:0}); });
  return acc;
},[]);
var activeHoleIndex = -1;
var lastHoleIndex = -1;
var nextSpawnAt = 0;
var fallers = [];
var nextFallerAt = 0;

var state = {
  phase:'start', // start, intro, playing, retry, jumpscare, levelEnding, paused, end
  pausedFrom:'start',

};
var particles = [];

var PROGRESS_KEY = 'pfn_progress_v2';

function loadBest(){
  try {
    var raw = localStorage.getItem(BEST_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function saveBest(level, hits){
  try {
    var cur = loadBest();
    if (!cur || level > cur.level || (level === cur.level && hits > cur.hits)){
      localStorage.setItem(BEST_KEY, JSON.stringify({level:level, hits:hits}));
      return {level:level, hits:hits};
    }
    return cur;
  } catch(e){ return {level:level, hits:hits}; }
}
function renderBestLine(){
  var b = loadBest();
  var el = document.getElementById('bestLine');
  el.textContent = b ? ('最高紀錄:闖到第 ' + Math.min(b.level,7) + ' 關,共打中 ' + b.hits + ' 隻') : '尚無紀錄,快來挑戰看看!';
}

function getMaxCleared(){
  try {
    var raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? (JSON.parse(raw).maxCleared || 0) : 0;
  } catch(e){ return 0; }
}
function markCleared(levelNum){
  try {
    var raw = localStorage.getItem(PROGRESS_KEY);
    var prog = raw ? JSON.parse(raw) : {maxCleared:0};
    if (levelNum > prog.maxCleared) prog.maxCleared = levelNum;
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
  } catch(e){}
  reportLevelReached(levelNum);
}
function renderLevelGrid(){
  var el = document.getElementById('lvlGrid');
  if (!el) return;
  var maxCleared = getMaxCleared();
  el.innerHTML = '';
  for (var i=1;i<=7;i++){
    (function(levelNum){
      var tile = document.createElement('div');
      var cleared = levelNum <= maxCleared;
      var unlocked = levelNum <= maxCleared+1;
      tile.className = 'lvltile' + (cleared ? ' cleared' : '') + (unlocked ? '' : ' locked');
      tile.textContent = unlocked ? String(levelNum) : '🔒';
      tile.setAttribute('role','button');
      tile.tabIndex = unlocked ? 0 : -1;
      tile.title = !unlocked ? ('先完成第 ' + (levelNum-1) + ' 關才能解鎖') : (cleared ? ('重玩第 ' + levelNum + ' 關') : ('挑戰第 ' + levelNum + ' 關'));
      if (unlocked){
        tile.addEventListener('click', function(){ enterLevelDirect(levelNum); });
        tile.addEventListener('keydown', function(e){
          if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); enterLevelDirect(levelNum); }
        });
      }
      el.appendChild(tile);
    })(i);
  }
  var summary = document.getElementById('clearSummary');
  if (summary) summary.textContent = '已通過 ' + Math.min(maxCleared,7) + ' / 7 關';
}
function enterLevelDirect(levelNum){
  if (levelNum > getMaxCleared()+1) return;
  ensureAudio();
  state.playerName = currentPlayerName();
  savePlayerName(state.playerName);
  hideHomeScreen();
  state.totalHits = 0;
  startLevel(levelNum-1);
}

function loadPlayerName(){

  var name = input ? input.value.trim() : '';
  if (!name) name = '匿名玩家';
  return name.slice(0,16);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function loadLeaderboard(){
  try {
    var raw = localStorage.getItem(LB_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveLeaderboard(lb){
  try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch(e){}
}
function ensurePlayerEntry(lb, name){
  if (!lb[name]) lb[name] = {name:name, maxLevel:0, pumpkins:0};
  return lb[name];
}
function addPumpkinPick(){
  var name = state.playerName || currentPlayerName();
  var lb = loadLeaderboard();
  var entry = ensurePlayerEntry(lb, name);
  entry.pumpkins++;

}
function reportLevelReached(levelNum){
  var name = state.playerName || currentPlayerName();
  var lb = loadLeaderboard();
  var entry = ensurePlayerEntry(lb, name);
  if (levelNum > entry.maxLevel) entry.maxLevel = levelNum;
  saveLeaderboard(lb);

function renderLeaderboard(){
  var lb = loadLeaderboard();

  arr.sort(function(a,b){

    return b.pumpkins - a.pumpkins;
  });
  var tbody = document.getElementById('rankTableBody');

    tr.innerHTML = '<td>' + (i+1) + '</td><td>' + escapeHtml(entry.name) + '</td><td>' + levelText + '</td><td>' + entry.pumpkins + '</td>';

function switchHomeTab(which){
  var lvlPanel = document.getElementById('levelsPanel');
  var rankPanel = document.getElementById('rankPanel');
  var tabL = document.getElementById('tabLevelsBtn');
  var tabR = document.getElementById('tabRankBtn');
  if (which === 'rank'){
    lvlPanel.hidden = true; rankPanel.hidden = false;
    tabL.classList.remove('active'); tabR.classList.add('active');
    renderLeaderboard();
  } else {
    lvlPanel.hidden = false; rankPanel.hidden = true;
    tabL.classList.add('active'); tabR.classList.remove('active');
  }
}

function pickHoleIndex(){
  if (holes.length<=1) return 0;
  var idx;
  do { idx = Math.floor(Math.random()*holes.length); } while (idx===lastHoleIndex);
  lastHoleIndex = idx;
  return idx;
}
function scheduleNextSpawn(){
  var lvl = LEVELS[state.levelIndex];
  activeHoleIndex = -1;
  nextSpawnAt = now() + lvl.gapMin + Math.random()*(lvl.gapMax-lvl.gapMin);
}
function resetHoles(){
  var lvl = LEVELS[state.levelIndex];
  var t = now();
  holes.forEach(function(h, idx){
    h.up=false; h.hit=false; h.retractAt=0; h.leavingAt=-9999;
    if (lvl.multi){
      h.nextSpawn = t + 200 + idx*90 + Math.random()*260;
    }
  });
  activeHoleIndex = -1;
  lastHoleIndex = -1;
  nextSpawnAt = t + 500;
  fallers = [];
  nextFallerAt = t + 1200 + Math.random()*800;
}

function startLevel(idx){
  state.levelIndex = idx;
  state.levelHits = 0;
  state.levelMiss = 0;
  state.jumpscareShownThisLevel = false;
  state.phase = 'intro';
  var lvl = LEVELS[idx];
  document.getElementById('levelBannerTitle').textContent = 'LEVEL ' + lvl.n;
  document.getElementById('levelBannerSub').textContent = lvl.sub;
  showOverlay('levelBanner');
  resetHoles();
  musicForLevel(lvl.n);
  state.introUntil = now() + INTRO_MS;
}

function beginPlaying(){
  state.phase = 'playing';
  hideOverlay('levelBanner');
  var lvl = LEVELS[state.levelIndex];
  state.levelEndAt = now() + (lvl.timeMs || LEVEL_TIME_MS);
}

function endLevel(){
  var lvl = LEVELS[state.levelIndex];
  function checkPassFail(){
    var passed = lvl.mode !== 'score' || state.levelHits >= lvl.threshold;
    if (passed){
      markCleared(lvl.n);
      renderLevelGrid();
      playPassChime();
    }
    if (passed || !lvl.retryOnFail){
      advanceToNext();
    } else {
      state.phase = 'retry';
      document.getElementById('retryText').textContent =
        '第 ' + lvl.n + ' 關需要打中 ' + lvl.threshold + ' 隻,你打中了 ' + state.levelHits + ' 隻。再拼一次!';
      showOverlay('retryBanner');
      state.retryUntil = now() + RETRY_MS;
    }
  }
  // Guarantee every scary level shows at least one jumpscare: 'endOfLevel'
  // levels always scare when the level ends, and 'every3miss' levels scare
  // at the end too if the player didn't miss enough during play to trigger
  // one already (so a skilled player still gets scared at least once).
  var guaranteeScare = lvl.jumpscare === 'endOfLevel' ||
    (lvl.jumpscare === 'every3miss' && !state.jumpscareShownThisLevel);
  if (guaranteeScare){
    triggerJumpscare(function(){ checkPassFail(); });
  } else {
    checkPassFail();
  }
}

function advanceToNext(){
  var next = state.levelIndex + 1;
  if (next >= LEVELS.length){
    finishGame();
  } else {
    startLevel(next);
  }
}

function finishGame(){
  state.phase = 'end';
  stopMusic();
  playLoop(TRACK_VICTORY, 168);
  document.getElementById('endHits').textContent = state.totalHits;
  var best = saveBest(8, state.totalHits);
  reportLevelReached(8);
  document.getElementById('endBest').textContent = '最高紀錄:闖到第 7 關(全破!),共打中 ' + best.hits + ' 隻';
  renderBestLine();
  showOverlay('endScreen');
}

// All jumpscare photos are embedded directly in this file as base64 data
// URIs, instead of being loaded from separate .jpg files on the server.
// This is the definitive fix for jumpscare photos not appearing: the image
// data travels inside index.html itself, so a missing, renamed, or
// case-mismatched file on the hosting server (e.g. Vercel/GitHub, which is
// case-sensitive) can never cause a blank jumpscare again - there is

function triggerJumpscare(cb){
  state.phase = 'jumpscare';
  state.jumpscarePlaying = true;
  state.jumpscareShownThisLevel = true;
  var el = document.getElementById('jumpscare');
  var imgEl = document.getElementById('scareImg');
  var fallbackEl = document.getElementById('scareFallback');
  // The embedded base64 photo pool is always present (see SCARE_IMAGES_B64
  // above), so this practically always shows a real photo. The onerror
  // handler + CSS fallback stay in as a last-resort safety net only.
  if (SCARE_IMAGES_B64.length){
    imgEl.hidden = false;
    fallbackEl.hidden = true;
    imgEl.onerror = function(){
      imgEl.onerror = null;
      imgEl.hidden = true;
      fallbackEl.hidden = false;
    };
    imgEl.src = SCARE_IMAGES_B64[Math.floor(Math.random()*SCARE_IMAGES_B64.length)];
  } else {
    imgEl.hidden = true;
    fallbackEl.hidden = false;
  }
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('show'); });
  playJumpscareSound();
  var dur = 900;
  setTimeout(function(){
    el.classList.remove('show');
    el.hidden = true;
    state.jumpscarePlaying = false;
    if (state.phase === 'jumpscare') state.phase = 'playing';
    if (cb) cb();
  }, dur);
}

// TV-static "channel flip" transition: draws ~0.5s of colorful, jagged
// zigzag TV-glitch bars (like an old analog TV losing signal) onto a
// fullscreen canvas above everything else, with a matching noise-burst
// sound. Used whenever the game cuts back to the home screen so the switch
// feels like an old TV changing channels.
var GLITCH_PALETTE = ['#ffffff','#f5f500','#00eaff','#00e676','#ff29d6','#ff1744','#2b4bff','#101010'];
function playGlitchTransition(cb){
  var canvas = document.getElementById('glitchOverlay');
  if (!canvas || !canvas.getContext){ if (cb) cb(); return; }
  var ctx = canvas.getContext('2d');
  var W = 64, H = 40;
  canvas.width = W;
  canvas.height = H;
  canvas.hidden = false;
  noiseBurst(0.42, {freqFrom:6500, freqTo:1200, gain:0.22});
  noiseBurst(0.2, {freqFrom:9000, freqTo:6000, gain:0.14});
  var DUR = 480;
  var start = null;
  var segCount = 7;
  var segW = W / segCount;
  function drawFrame(ts){
    if (start === null) start = ts;
    var t = ts - start;
    var phase = t * 0.028;
    var amp = 4 + Math.random()*5;
    var freq = 0.3 + Math.random()*0.3;
    for (var y=0; y<H; y++){
      var wobble = Math.sin(y*freq + phase) * amp + (Math.random()*3 - 1.5);
      for (var s=-1; s<=segCount; s++){
        var swap = Math.random() < 0.12 ? 1 : 0;
        ctx.fillStyle = GLITCH_PALETTE[((s+swap)%GLITCH_PALETTE.length+GLITCH_PALETTE.length)%GLITCH_PALETTE.length];
        ctx.fillRect(s*segW + wobble, y, segW+2, 1);
      }
    }
    // occasional bright flash / horizontal tear line, like a channel pop
    if (Math.random() < 0.12){
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(0, (Math.random()*H)|0, W, 2 + ((Math.random()*3)|0));
    }
    if (t < DUR){
      requestAnimationFrame(drawFrame);
    } else {
      canvas.hidden = true;
      if (cb) cb();
    }
  }
  requestAnimationFrame(drawFrame);
}

function onHit(h){
  var lvl = LEVELS[state.levelIndex];
  h.up = false;
  h.hit = true;
  h.leavingAt = now();
  state.levelHits++;
  state.totalHits++;
  addPumpkinPick();
  playHit(lvl.n);
  spawnParticles(h.x, h.y-6, lvl.scary ? '#e0570f' : '#ff8f1f');
  popups.push({x:h.x, y:h.y-14, life:600, born:now(), text:'+1'});
  if (lvl.multi){
    h.nextSpawn = now() + lvl.gapMin + Math.random()*(lvl.gapMax-lvl.gapMin);
  } else {
    scheduleNextSpawn();
  }
}
function onFallerHit(f){
  var lvl = LEVELS[state.levelIndex];
  f.hit = true;
  f.hitAt = now();
  state.levelHits++;
  state.totalHits++;
  addPumpkinPick();
  playHit(lvl.n);
  spawnParticles(f.x, f.y-6, lvl.scary ? '#e0570f' : '#ff8f1f');
  popups.push({x:f.x, y:f.y-14, life:600, born:now(), text:'+1'});
}
function onMiss(h){
  state.levelMiss++;
  var lvl = LEVELS[state.levelIndex];
  if (lvl.jumpscare === 'instant' && !state.jumpscarePlaying){
    triggerJumpscare(null);
  } else if (lvl.jumpscare === 'every3miss' && !state.jumpscarePlaying && state.levelMiss % 3 === 0){
    triggerJumpscare(null);
  }
}
function spawnParticles(x,y,color){
  for (var i=0;i<8;i++){
    particles.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*90,
      vy:-40-Math.random()*70,
      life:450, born:now(),
      color:color, size:2+Math.random()*2
    });
  }
}

--------------------------------------------------------------- */
var PAUSABLE_PHASES = ['intro','playing','retry'];
function togglePause(){
  if (state.phase === 'paused'){ resumeGame(); }
  else if (PAUSABLE_PHASES.indexOf(state.phase) >= 0){ pauseGame(); }
}
function pauseGame(){
  clock.pauseStart = performance.now();
  clock.isPaused = true;
  state.pausedFrom = state.phase;
  state.phase = 'paused';
  stopMusic();
  showOverlay('pauseOverlay');
  document.getElementById('pauseBtn').textContent = '繼續';
}
function resumeGame(){
  clock.pausedAccum += performance.now() - clock.pauseStart;
  clock.isPaused = false;
  state.phase = state.pausedFrom;
  hideOverlay('pauseOverlay');
  document.getElementById('pauseBtn').textContent = '暫停';
  musicForLevel(LEVELS[state.levelIndex].n);
}

/* ---------------------------------------------------------------
   INPUT
--------------------------------------------------------------- */
function canvasPoint(evt){
  var rect = canvas.getBoundingClientRect();
  var cx = (evt.clientX - rect.left) * (W/rect.width);
  var cy = (evt.clientY - rect.top) * (H/rect.height);
  return {x:cx, y:cy};
}
function inEllipse(px,py,cx,cy,rx,ry){
  var dx=(px-cx)/rx, dy=(py-cy)/ry;
  return dx*dx+dy*dy <= 1;
}
canvas.addEventListener('pointerdown', function(evt){
  ensureAudio();
  if (state.phase !== 'playing') return;
  var p = canvasPoint(evt);
  var lvl = LEVELS[state.levelIndex];
  if (lvl.falling){
    for (var fj=0; fj<fallers.length; fj++){
      var f = fallers[fj];
      if (!f.hit && inEllipse(p.x,p.y,f.x,f.y-4,24,22)){
        onFallerHit(f);
        return;
      }
    }
  }
  // pass 1: any hole that is actually up is the real target - use the generous
  // whole-pumpkin hit box. Checking h.up first (before the ellipse test) means
  // overlapping hit boxes between the closely-spaced rows never shadow the
  // pumpkin that's really there.
  for (var i=0;i<holes.length;i++){
    var h = holes[i];
    if (h.up && !h.hit && inEllipse(p.x,p.y,h.x,h.y-5,26,22)){
      onHit(h);
      return;
    }
  }
  // pass 2: nothing live was hit - a click that lands on an empty hole still
  // counts as a miss, using the tighter original radius so empty neighboring
  // holes (now covered by the bigger pass-1 boxes) don't overlap each other.
  for (var j=0;j<holes.length;j++){
    var h2 = holes[j];
    if (inEllipse(p.x,p.y,h2.x,h2.y,HOLE_RX+6,HOLE_RY+10)){
      onMiss(h2);
      break;
    }
  }
});

/* ---------------------------------------------------------------
   MAIN LOOP
--------------------------------------------------------------- */
function frame(){
  requestAnimationFrame(frame);
  var t = now();
  var lvl = LEVELS[state.levelIndex];

  if (state.phase === 'intro' && t >= state.introUntil){
    beginPlaying();
  }
  if (state.phase === 'retry' && t >= state.retryUntil){
    hideOverlay('retryBanner');
    startLevel(state.levelIndex);
  }

  if (state.phase === 'playing'){
    if (lvl.multi){
      holes.forEach(function(h){
        if (!h.up && !h.hit && t >= h.nextSpawn && (t - h.leavingAt) > LEAVE_MS){
          h.up = true; h.hit = false; h.leavingAt = -9999;
          h.retractAt = t + lvl.upMs;
        }
        if (h.up && !h.hit && t >= h.retractAt){
          h.up = false; h.leavingAt = t;
          onMiss(h);
          h.nextSpawn = t + lvl.gapMin + Math.random()*(lvl.gapMax-lvl.gapMin);
        }
        if (h.hit && t - h.leavingAt > LEAVE_MS){
          h.hit = false;
        }
      });
    } else {
      if (activeHoleIndex === -1 && t >= nextSpawnAt){
        var idx = pickHoleIndex();
        activeHoleIndex = idx;
        var nh = holes[idx];
        nh.up = true; nh.hit = false; nh.leavingAt = -9999;
        nh.retractAt = t + lvl.upMs;
      }
      if (activeHoleIndex !== -1){
        var ah = holes[activeHoleIndex];
        if (ah.up && !ah.hit && t >= ah.retractAt){
          ah.up = false; ah.leavingAt = t;
          onMiss(ah);
          scheduleNextSpawn();
        }
        if (ah.hit && t - ah.leavingAt > LEAVE_MS){
          ah.hit = false;
        }
      }
    }
    if (lvl.falling){
      if (t >= nextFallerAt){
        var speed = (36 + (lvl.n-4)*14) / 1000; // px per ms
        fallers.push({
          x: 30 + Math.random()*(W-60),
          y: FALL_TOP_Y,
          vy: speed,
          bornAt: t,
          hit:false,
          hitAt:0
        });
        var fg = Math.max(500, 1500 - lvl.n*110);
        nextFallerAt = t + fg + Math.random()*fg*0.7;
      }
      for (var fk=fallers.length-1; fk>=0; fk--){
        var fl = fallers[fk];
        if (!fl.hit){
          fl.y = FALL_TOP_Y + fl.vy*(t-fl.bornAt);
          if (fl.y > FALL_BOTTOM_Y){
            onMiss();
            fallers.splice(fk,1);
          }
        } else if (t - fl.hitAt > 260){
          fallers.splice(fk,1);
        }
      }
    }
    var remaining = state.levelEndAt - t;
    if (remaining <= 0){
      state.phase = 'levelEnding';
      holes.forEach(function(h){ h.up=false; });
      activeHoleIndex = -1;
      fallers = [];
      endLevel();
    }
    updateHud(Math.max(0,remaining));
  } else if (state.phase === 'intro'){
    updateHud(lvl.timeMs || LEVEL_TIME_MS);
  }

  draw(t);
}

function updateHud(remainingMs){
  var lvl = LEVELS[state.levelIndex];
  document.getElementById('hudLevel').textContent = lvl.n + '/7';
  document.getElementById('hudTime').textContent = Math.ceil(remainingMs/1000) + 's';
  document.getElementById('hudScore').textContent = lvl.mode==='score' ? (state.levelHits+'/'+lvl.threshold) : state.levelHits;
  document.getElementById('hudMiss').textContent = state.levelMiss;
  document.getElementById('hudTotal').textContent = state.totalHits;
}

function draw(t){
  var lvl = LEVELS[state.levelIndex] || LEVELS[0];
  var scary = lvl.scary && state.phase !== 'start';

  var sky1 = scary ? '#150a1d' : '#150e26';
  var sky2 = scary ? '#2b0f1c' : '#241a38';
  var grd = ctx.createLinearGradient(0,0,0,90);
  grd.addColorStop(0, sky1);
  grd.addColorStop(1, sky2);
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,90);

  drawMoon(ctx, t);
  drawBat(ctx, 60 + Math.sin(t/900)*20, 24 + Math.sin(t/500)*4, t/220);
  drawBat(ctx, 150 + Math.sin(t/700+2)*26, 40 + Math.sin(t/430+1)*4, t/180+2);

  [[24,58,26,36],[70,64,20,30],[190,60,22,34],[232,66,18,28]].forEach(function(tb,i){
    drawTombstone(ctx, tb[0], tb[1], tb[2], tb[3], i%2===0);
  });

  drawGround(ctx);
  drawFog(ctx, t);

  holes.forEach(function(h){ drawHole(ctx,h.x,h.y); });

  holes.forEach(function(h){
    var scale = 0;
    if (h.up){
      var age = t - (h.retractAt - lvl.upMs);
      scale = Math.min(1, age/RISE_MS);
    } else if (h.hit || (t - h.leavingAt) < LEAVE_MS){
      scale = 1 - Math.min(1,(t-h.leavingAt)/LEAVE_MS);
    }
    if (scale > 0.02){
      drawPumpkin(ctx, h.x, h.y-2, scale, scary, false);
    }
  });

  fallers.forEach(function(f){
    var sc = f.hit ? Math.max(0, 0.85*(1-(t-f.hitAt)/260)) : 0.85;
    if (sc > 0.02) drawPumpkin(ctx, f.x, f.y, sc, scary, false);
  });

  particles = particles.filter(function(p){ return t-p.born < p.life; });
  particles.forEach(function(p){
    var pt = (t-p.born)/p.life;
    var x = p.x + p.vx*pt*0.35;
    var y = p.y + p.vy*pt*0.35 + 60*pt*pt;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 1-pt;
    ctx.fillRect(x,y,p.size,p.size);
    ctx.globalAlpha = 1;
  });

  popups = popups.filter(function(p){ return t-p.born < p.life; });
  popups.forEach(function(p){
    var pt = (t-p.born)/p.life;
    ctx.fillStyle = 'rgba(126,232,184,'+(1-pt)+')';
    ctx.font = '8px monospace';
    ctx.fillText(p.text, p.x-4, p.y - pt*14);
  });
}

/* ---------------------------------------------------------------
   BOOT
--------------------------------------------------------------- */
function boot(){
  var pn = document.getElementById('playerNameInput');
  if (pn) pn.value = loadPlayerName();
  switchHomeTab('levels');
  renderBestLine();
  renderLevelGrid();
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(function(){ boot(); });
} else {
  boot();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){ return {}; });
}

})();
</script>
