<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社群經營工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0EE;--panel:#FFFFFF;--panel2:#F6F8F7;--ink:#16222A;--muted:#5E6E77;--line:#D8DFDC;
  --brand:#1B6B6F;--brand-soft:#DCEEEE;--brand-ink:#FFFFFF;
  --warn:#9A5B00;--warn-soft:#FFF0D6;--danger:#B3261E;--danger-soft:#FBE3E0;--ok:#2C7A4B;--ok-soft:#DDF1E4;
  --side:#16222A;--side-ink:#C9D6DC;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1619;--panel:#172025;--panel2:#1D282E;--ink:#E6EDF0;--muted:#92A4AD;--line:#2A363D;
    --brand:#5CC0C4;--brand-soft:#1B3B3E;--brand-ink:#0B1A1C;
    --warn:#F0B25A;--warn-soft:#3A2D12;--danger:#F28B82;--danger-soft:#3D1F1D;--ok:#7CCB9A;--ok-soft:#16301F;
    --side:#0B1114;--side-ink:#9FB1B9;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1619;--panel:#172025;--panel2:#1D282E;--ink:#E6EDF0;--muted:#92A4AD;--line:#2A363D;
  --brand:#5CC0C4;--brand-soft:#1B3B3E;--brand-ink:#0B1A1C;
  --warn:#F0B25A;--warn-soft:#3A2D12;--danger:#F28B82;--danger-soft:#3D1F1D;--ok:#7CCB9A;--ok-soft:#16301F;
  --side:#0B1114;--side-ink:#9FB1B9;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:224px 1fr;height:100%;min-height:0}
/* sidebar */
#nav{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto}
#nav .logo{padding:6px 10px 12px;color:#fff;font-weight:700;font-size:16px;line-height:1.3}
#nav .logo small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);margin-top:2px}
#nav .grp{font-size:11px;letter-spacing:.08em;color:#7F929B;padding:12px 10px 4px}
#nav button{background:none;border:0;color:inherit;text-align:left;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
#nav button span.ic{width:22px;display:inline-block}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
#nav .badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#nav .badge.w{background:#C77A00}
#nav .me{margin-top:auto;padding:12px 10px 4px;font-size:12px;border-top:1px solid rgba(255,255,255,.12)}
#nav .me b{color:#fff;display:block;font-size:13px}
#nav .theme{font-size:12px;opacity:.85;margin-top:6px}
#wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:6px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:48px}
#top .lbl{color:var(--muted);font-size:12px;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.ai{margin-left:auto;font-weight:500}
.chip.ai.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ai.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ai.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#main{flex:1;min-height:0;overflow:auto;padding:20px;max-width:100%}
#main.inboxmode{padding:0;overflow:hidden}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:4px 16px;border-bottom:1px solid var(--line)}
.page{max-width:1100px;margin:0 auto}
.help{background:var(--brand-soft);color:var(--ink);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:14px;display:flex;gap:8px}
.help b{color:var(--brand)}
/* inbox */
#inbox{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) 300px;height:100%;min-height:0}
#list,#detail,#side{overflow:auto;min-height:0;min-width:0}
#list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side{background:var(--panel);border-left:1px solid var(--line);padding:14px}
#detail{padding:16px}
.filters{padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;top:0;background:var(--panel);z-index:2}
.filters input[type=search]{grid-column:1/-1}
.filters input,.filters select{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 8px;min-width:0}
.filters label{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.row{position:relative;padding:10px 12px 12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--brand-soft)}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.row.over .bar{background:var(--danger)}.row.near .bar{background:var(--warn)}.row.ok .bar{background:var(--brand)}.row.met .bar{background:var(--ok)}
.row .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.row .txt{margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.row.near .prog i{background:var(--warn)}.row.over .prog i{background:var(--danger)}
.pf{font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:0 5px;line-height:17px}
.tag{font-size:12px;border-radius:4px;padding:0 7px;line-height:20px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);display:inline-block}
.tag.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.tag.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.sla{font-size:12px;font-weight:700}
.sla.over{color:var(--danger)}.sla.near{color:var(--warn)}.sla.ok{color:var(--brand)}.sla.met{color:var(--ok)}.sla.late{color:var(--danger)}.sla.na{color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px}
.card h4{margin:12px 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.hd h2{margin:0;font-size:20px;line-height:1.4}
.sub{color:var(--muted);font-size:13px}
.bubble{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:10px 14px;border:1px solid var(--line);font-size:15px}
.bubble.brandside{background:var(--brand-soft);border-color:transparent;border-radius:14px 4px 14px 14px;margin-left:36px}
.post{border-left:3px solid var(--line);padding:2px 12px;color:var(--muted);font-size:13px;margin-bottom:10px}
.slabox{border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.slabox.over{background:var(--danger-soft);color:var(--danger)}.slabox.near{background:var(--warn-soft);color:var(--warn)}.slabox.ok{background:var(--brand-soft);color:var(--brand)}.slabox.met{background:var(--ok-soft);color:var(--ok)}.slabox.late{background:var(--danger-soft);color:var(--danger)}.slabox.na{background:var(--panel2);color:var(--muted)}
.slabox b{font-size:15px}
textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:500}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:2px 10px;font-size:12px;border-radius:6px}
.btn[disabled],textarea[disabled],select[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.infobox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.kb{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px;background:var(--panel2)}
select,input[type=text],input[type=number],input[type=email],input[type=password]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;min-width:0}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.over .v{color:var(--danger)}.kpi.near .v{color:var(--warn)}.kpi.good .v{color:var(--ok)}
button.kpi{text-align:left;width:100%}
button.kpi:hover{border-color:var(--brand)}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hbar{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hbar .t{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--brand);border-radius:5px}
.hbar .t i.w{background:var(--warn)}.hbar .t i.d{background:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
.tblwrap{overflow-x:auto}
.sw{position:relative;width:38px;height:22px;display:inline-block;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--brand)}.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=password],.field textarea,.field select{width:100%}
.field textarea{min-height:70px}
input[type=range]{width:100%;accent-color:var(--brand)}
.chk{width:18px;height:18px;accent-color:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.back{display:none}
/* new */
.choice{display:flex;gap:8px;flex-wrap:wrap}
.cb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px}
.cb:hover{border-color:var(--brand)}
.cb.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.opt:hover{border-color:var(--brand)}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps div{flex:1;min-width:110px;border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted)}
.steps div.on{border-color:var(--brand);color:var(--ink);font-weight:700}
.steps div.done{border-color:var(--ok);color:var(--ok)}
.q{margin-bottom:20px}
.q .l{font-weight:700;display:block;margin-bottom:2px}
.q .h{font-size:13px;color:var(--muted);margin-bottom:6px}
.q input[type=text],.q textarea{width:100%}
.bcard{border-left:6px solid var(--brand)}
.meter{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--warn)}.meter i.d{background:var(--danger)}
.keyrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.zone{border:1px solid var(--danger);border-radius:10px;padding:14px;background:var(--danger-soft)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ck .m{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.ck.done .m{background:var(--ok);border-color:var(--ok);color:#fff}
.mask{position:fixed;inset:0;background:rgba(10,18,22,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin:0 0 4px;font-size:18px}
@media (max-width:1180px){
  #inbox{grid-template-columns:minmax(280px,340px) minmax(0,1fr)}
  #side{display:none}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #nav{flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
  #nav .logo,#nav .me,#nav .grp{display:none}
  #nav button{white-space:nowrap;flex:none}
  #main{padding:12px}
  .chip.ai{margin-left:0}
}
@media (max-width:640px){
  #inbox{grid-template-columns:1fr}
  #inbox #detail{display:none}
  #inbox.open #list{display:none}
  #inbox.open #detail{display:block}
  .back{display:inline-block;margin-bottom:10px}
  #side{display:block;border-left:0;border-top:1px solid var(--line)}
  #inbox:not(.open) #side{display:none}
  .two,.three{grid-template-columns:1fr}
  .hbar{grid-template-columns:72px 1fr 44px}
}

/* 小助手 */
#asBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:0 18px;min-height:48px;display:flex;align-items:center;gap:8px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#asPanel{position:fixed;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);height:min(620px,calc(100vh - 32px));z-index:75;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);flex-direction:column;overflow:hidden}
.ashd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.asav{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.asbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.asnote{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:6px 10px}
.asmsg{max-width:92%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.6}
.asmsg.bot{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}
.asmsg.user{background:var(--brand);color:var(--brand-ink);align-self:flex-end}
.aschips{display:flex;gap:6px;flex-wrap:wrap}
.asin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.asin input{flex:1;min-width:0}
@media (max-width:640px){#asPanel{inset:0;width:100%;max-width:none;height:100%;border-radius:0;right:0;bottom:0}}
@media (max-width:1024px){.btn,.cb,.chip,#nav button,select,input[type=text],input[type=number],input[type=email],input[type=password],.opt{min-height:44px}.sw{min-height:0}.chk{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="主選單"></nav>
  <div id="wrap">
    <div class="demo">原型示範：資料、AI 回覆與連接流程都是模擬，用來確認操作與設計；正式版才會真的串接 Instagram 與 AI 供應商。</div>
    <div id="top"></div>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
/* ================= 基本資料 ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const T0=Date.now();
const PALETTE=['#7A5BD0','#2E8B57','#1E88C7','#C2410C','#B83280','#0F766E','#7C6A0A'];
const PF={'FB 粉專':['FB','#3B5BA9'],'FB 廣告':['FB','#3B5BA9'],'IG 貼文':['IG','#B13A86'],'IG Reels':['IG','#B13A86'],'YouTube':['YT','#C4302B'],'Shorts':['YT','#C4302B'],'Google 評論':['G','#3A7D44']};
const MODES={manual:'人工處理',suggest:'AI 建議＋人工確認',auto:'AI 自動回覆'};
const TYPES={
 '一般互動':{sla:60,mode:'suggest',on:true},'稱讚':{sla:60,mode:'auto',on:true},'產品詢問':{sla:30,mode:'suggest',on:true},
 '價格詢問':{sla:30,mode:'suggest',on:true},'購買詢問':{sla:30,mode:'suggest',on:true},'使用方式':{sla:60,mode:'suggest',on:true},
 '售後問題':{sla:30,mode:'suggest',on:true},'客訴':{sla:15,mode:'manual',on:true},'負面評論':{sla:30,mode:'manual',on:true},
 '商業合作':{sla:30,mode:'manual',on:true},'大量採購':{sla:30,mode:'manual',on:true},'潛在商機':{sla:30,mode:'suggest',on:true},

const fmt=ms=>{const m=Math.floor(ms/60000);return m<1?'不到 1 分鐘':m>=60?`${Math.floor(m/60)} 小時 ${m%60} 分`:`${m} 分鐘`};

function sla(c){
  const t=TYPES[c.type];
  if(!t||!t.sla||c.status==='無需處理')return{k:'na',txt:'不計時效',pct:0};
  if(c.first!=null){const ok=c.first<=t.sla;return{k:ok?'met':'late',txt:`首次回覆 ${c.first} 分鐘${ok?'':'（已超時）'}`,pct:1}}
  const lim=t.sla*60000,el=Date.now()-c.created,rem=lim-el,pct=Math.min(1,el/lim);
  if(rem<0)return{k:'over',txt:`已超時 ${fmt(-rem)}`,pct:1};
  return{k:rem<Math.max(5*60000,lim*.25)?'near':'ok',txt:`剩 ${fmt(rem)}`,pct};
}

/* ===== AI 選用邏輯：主要 → 備援 → 沒有可用(轉人工) ===== */
const keyOk=k=>!!k&&k.enabled&&k.status==='正常'&&k.used<k.budget;
function effAI(bid,task){
  const a=S.brandAI[bid];if(!a)return{key:null,why:'未設定'};
  if(a.manual){const k=aiKey(a.manual);if(keyOk(k))return{key:k,why:'手動指定'}}
  const p=aiKey(a[task]);if(keyOk(p))return{key:p,why:'主要'};
  const b=aiKey(a.backup);if(keyOk(b)&&b!==p&&(S.failover.budget||S.failover.error))return{key:b,why:'備援',from:p};
  return{key:null,why:'沒有可用的 AI'};
}
function recordUse(bid,task){
  const e=effAI(bid,task);if(!e.key)return null;
  const cost=task==='reply'?0.02:0.006,tok=task==='reply'?900:350;
  e.key.used+=cost;e.key.tok+=tok;
  const bb=S.use.byBrand[bid]=S.use.byBrand[bid]||{calls:0,tok:0,cost:0};bb.calls++;bb.tok+=tok;bb.cost+=cost;
  const bt=S.use.byTask[task];bt.calls++;bt.tok+=tok;bt.cost+=cost;
  const d=S.use.daily[S.use.daily.length-1];d.cost+=cost;d.calls++;
  if(e.why==='備援')S.use.failovers++;
  return e;
}
function aiHealth(){
  if(!S.aiKeys.length)return{k:'warn',t:'尚未綁定 AI'};
  let fo=0,none=0;S.brands.forEach(b=>{const e=effAI(b.id,'reply');if(!e.key)none++;else if(e.why==='備援')fo++});
  if(none)return{k:'bad',t:`${none} 個品牌沒有可用的 AI`};
  if(fo)return{k:'warn',t:`${fo} 個品牌已切到備援 AI`};
  return{k:'ok',t:'AI 運作正常'};
}

function filtered(){
  const f=S.f;
  return vis().filter(c=>{
    if(f.pf!=='all'&&c.pf!==f.pf)return false;
    if(f.st!=='all'&&c.status!==f.st)return false;
    if(f.pri!=='all'&&c.pri!==f.pri)return false;
    if(f.type!=='all'&&c.type!==f.type)return false;
    if(f.sla!=='all'){const k=sla(c).k;if(!open(c)||c.first!=null)return false;if(f.sla==='near'&&k!=='near')return false;if(f.sla==='over'&&k!=='over')return false}

    if(f.q&&!(c.text+c.u+c.post).toLowerCase().includes(f.q.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>urgency(a)-urgency(b));

function vInsight(m){

  const ids=scope.map(b=>b.id),cs=S.comments.filter(c=>ids.includes(c.brand));

  });

  const top=Object.entries(tcount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  <div class="card"><h3>值得製作的內容</h3>${ideas.map(([k,v])=>`<div style="margin:6px 0">・「${esc(k.split('｜')[0])}」收到 ${v} 則「${esc(k.split('｜')[1])}」→ 可以做一則說明貼文或加入知識庫</div>`).join('')}</div>

function finishWiz(){
  const w=S.wiz,a=w.a;
  if(!String(a.name||'').trim()){toast('請先填品牌名稱');w.step=0;render();return}
  let id=w.bid;
  const pe=eff(a,'personality'),p=PERS[pe]||[50,30,pe||''];
  if(w.mode==='new'){
    id='b'+(++S.seq);
    S.brands.push({id,name:a.name.trim(),c:PALETTE[S.brands.length%PALETTE.length],desc:a.category||''});
    const ok=S.aiKeys.filter(keyOk);
    S.brandAI[id]=ok.length?{classify:ok[0].id,reply:ok[0].id,backup:ok[1]?ok[1].id:'',manual:''}:{classify:'',reply:'',backup:'',manual:''};
    logAdd(S.me,'新增品牌',a.name);
  }else{
    const b=brandOf(id);b.name=a.name.trim();if(a.category)b.desc=a.category;
    S.kb=S.kb.filter(k=>!(k.b===id&&k.src==='survey'));
    logAdd(S.me,'更新品牌問卷',a.name);
  }
  S.profiles[id]=JSON.parse(JSON.stringify(a));
  const old=S.brandCfg[id]||{};
  S.brandCfg[id]=Object.assign({},old,{personality:p[2]||old.personality||'',formal:p[0],humor:p[1],len:old.len??50,emoji:a.emoji||'少量',addr:eff(a,'addr')||'您',ban:a.ban||'',nopromise:[].concat(eff(a,'nopromise')||[]).join('、'),words:old.words||''});
  const add=(cat,title,field)=>S.kb.push({id:Date.now()+Math.random(),b:id,cat,title,on:true,d:'今天',src:'survey',field});
  String(a.products||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>add('價格','商品與價格：'+x,'products'));
  if(a.sell)add('產品','商品賣點：'+a.sell,'sell');
  String(a.faq||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>add('常見問題',x,'faq'));
  if(a.usage)add('教學','使用與保養：'+a.usage,'usage');
  if(a.hours)add('服務','客服時間：'+a.hours,'hours');
  if(a.ship)add('服務','出貨與配送：'+a.ship,'ship');
  if(a.refund)add('政策','退換貨與保固：'+a.refund,'refund');
  if(a.complaint)add('政策','客訴處理：'+a.complaint,'complaint');
  if(a.contact)add('服務','真人聯絡窗口：'+a.contact,'contact');
  S.wiz=null;S.bd=id;S.view='brand';S.kbEdit=null;
  toast(w.mode==='new'?'品牌已建立，AI 已經認識它了':'問卷已更新');render();
}

      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px"><input type="checkbox" class="chk" data-in="mf" data-k="tester" ${d.tester?'checked':''}><span>目前是開發模式，我已把這個帳號加入測試名單<div class="sub">（正式版審核通過後就不需要）</div></span></label>

    body=`<h3>連接 IG 帳號</h3><div class="steps" style="margin:10px 0 14px">${[1,2,3].map(i=>`<div class="${i===d.step?'on':i<d.step?'done':''}">步驟 ${i}</div>`).join('')}</div><div style="font-weight:700;margin-bottom:10px">${stepT}</div>${inner}
      <div class="btns" style="justify-content:space-between"><button class="btn" data-act="${d.step===1?'mclose':'igprev'}">${d.step===1?'取消':'← 上一步'}</button>${d.step<3?`<button class="btn pri" data-act="ignext" ${(d.step===1&&(!d.kind||d.kind==='一般'))||(d.step===2&&!d.via)?'disabled':''}>下一步 →</button>`:`<button class="btn pri" data-act="igdone">同意並連接</button>`}</div>`;
  }
  el.innerHTML=`<div class="mask" data-act="mmask"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;

}

const VIEWS={home:vHome,inbox:vInbox,batch:vBatch,dash:vDash,insight:vInsight,usage:vUsage,brands:vBrands,brand:vBrand,wizard:vWizard,ig:vIG,ai:vAI,team:vTeam,rules:vRules,log:vLog};
function render(){
  const mn=$('#main'),same=S._lv===S.view&&S._lb===S.bd,st=mn.scrollTop;
  renderNav();VIEWS[S.view](mn);mn.scrollTop=same?st:0;S._lv=S.view;S._lb=S.bd;

function finish(c,status,by,aiUsed,edited,text){
  if(c.first==null)c.first=Math.max(0,Math.round((Date.now()-c.created)/60000));
  c.sent.push({by,t:text,ai:aiUsed,edited});
  c.by=by;c.owner=c.owner||by;c.lock=null;c.status=status;c.draft='';c.usedAi=false;
  if(aiUsed){S.stats.sug++;S.stats.adopt++;if(edited)S.stats.edit++}
}
function useAI(c,task){
  const e=recordUse(c.brand,task);
  if(!e){toast('這個品牌目前沒有可用的 AI');renderDetail();return null}
  if(e.why==='備援'&&S.failover.notify)logAdd('系統','自動切換 AI',`${brandOf(c.brand).name} 改用備援「${e.key.label}」`,true);
  c.aiBy=e.key.label+(e.why==='備援'?'（備援）':'');return e;
}
function startDelBrand(id){openModal({type:'delbrand',id})}
function doDelBrand(id){
  const b=brandOf(id);
  S.brands=S.brands.filter(x=>x.id!==id);S.comments=S.comments.filter(c=>c.brand!==id);S.kb=S.kb.filter(k=>k.b!==id);
  S.ig=S.ig.filter(i=>i.brand!==id);delete S.brandAI[id];delete S.brandCfg[id];delete S.profiles[id];
  S.team.forEach(t=>{if(t.brands!=='all')t.brands=t.brands.filter(x=>x!==id)});
  if(S.brand===id)S.brand='all';if(S.sel&&!cm(S.sel))S.sel=null;
  logAdd(S.me,'刪除品牌',b.name);closeModal();S.view='brands';toast('已刪除品牌「'+b.name+'」');render();
}

function onIn(e){
  const el=e.target,k=el.dataset.in;if(!k)return;
  const F=S.f,c=cm(S.sel),M=S.modal;
  if(k==='asme'){S.me=el.value;S.brand='all';S.sel=null;S.open=false;S.view='home';S.modal=null;render();toast('已切換成 '+S.me+'（'+meRole()+'）');return}
  if(k==='q'){if(composing||e.isComposing)return;F.q=el.value;renderRows();return}
  if(['pf','type','st','pri','sla'].includes(k)){F[k]=el.value;renderList();return}
  if(k==='ai'){F.ai=el.checked;renderList();return}
  if(k==='draft'&&c){claim(c);c.draft=el.value;return}
  if(k==='std'&&c&&el.value){claim(c);c.draft=el.value;c.usedAi=false;renderDetail();return}
  if(k==='status'&&c){c.status=el.value;if(DONE.includes(c.status))c.lock=null;logAdd(S.me,'變更狀態',`${c.u} → ${c.status}`);renderList();renderDetail();renderNav();return}
  if(k==='transfer'&&c&&el.value){c.owner=el.value;c.status='已轉交';c.lock=null;logAdd(S.me,'轉交',`${c.u} → ${el.value}`);toast(`已轉交給 ${el.value}`);renderList();renderDetail();renderNav();return}
  if(k==='manualai'&&c){const a=S.brandAI[c.brand]=S.brandAI[c.brand]||{};a.manual=el.value;logAdd(S.me,'手動切換 AI',`${brandOf(c.brand).name} → ${el.value?aiKey(el.value).label:'自動'}`);toast(el.value?'已手動切換':'已改回自動');renderDetail();renderNav();return}
  if(k==='bedit'){if(composing||e.isComposing)return;cm(+el.dataset.id)._bd=el.value;return}
  if(k==='batchop'){S.batchOp=el.checked;logAdd(S.me,el.checked?'開放操作人員一次回覆':'關閉操作人員一次回覆','');render();return}
  if(k==='bchk'){cm(+el.dataset.id)._b=el.checked;return}
  if(k==='bname'){const b=brandOf(S.bd);b.name=el.value;if(S.profiles[S.bd])S.profiles[S.bd].name=el.value;return}
  if(k==='bdesc'){brandOf(S.bd).desc=el.value;return}
  if(k==='cfg'){const cf=S.brandCfg[S.bd],kk=el.dataset.k;cf[kk]=el.type==='range'?+el.value:el.value;if(e.type==='change'&&el.tagName!=='INPUT'||(e.type==='change'&&el.type==='range')){toast('已儲存');render()}else if(e.type==='change')toast('已儲存');return}
  if(k==='kbon'){const x=S.kb.find(i=>i.id==el.dataset.id);x.on=el.checked;toast(x.on?'AI 會使用這筆資料':'已暫時關閉這筆資料');render();return}
  if(k==='delname'){const ok=el.value.trim()===brandOf(M.id).name;const b=$('#delOk');if(b)b.disabled=!ok;return}
  if(k==='wq'){if(composing||e.isComposing)return;S.wiz.a[el.dataset.id]=el.value;const oc=el.dataset.id.endsWith('_other')&&$('#oc_'+el.dataset.id.replace('_other',''));if(oc)oc.textContent=el.value.length+' / 200'+(el.value.trim()?'':'　選了「其他」，請補充說明');return}
  if(k==='mf'&&M){M.d[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;M.d.err='';if(el.tagName==='SELECT'){M._f=1;renderModal()}return}
  if(k==='mall'&&M){M.d.all=el.checked;M._f=1;renderModal();return}
  if(k==='mbr'&&M){const id=el.dataset.id,b=M.d.brands;M.d.brands=el.checked?b.concat(id):b.filter(x=>x!==id);return}
  if(k==='mact'&&M){M.d.active=el.checked;return}
  if(k==='bai'){const a=S.brandAI[el.dataset.b]=S.brandAI[el.dataset.b]||{};a[el.dataset.k]=el.value;logAdd(S.me,'調整 AI 設定',`${brandOf(el.dataset.b).name}：${el.dataset.k} → ${el.value?aiKey(el.value).label:'無'}`);toast('已儲存');render();return}
  if(k==='aien'){aiKey(el.dataset.id).enabled=el.checked;toast(el.checked?'已啟用':'已停用');render();return}
  if(k==='aibud'){const v=+el.value;if(v>0){aiKey(el.dataset.id).budget=v;if(e.type==='change'){toast('預算已更新');render()}}return}
  if(k==='fo'){S.failover[el.dataset.k]=el.checked;toast('已儲存');return}
  if(k==='ck'){S.ck[el.dataset.k]=el.checked;render();return}
  if(k==='tyon'){TYPES[el.dataset.k].on=el.checked;toast('已儲存');return}
  if(k==='tysla'){TYPES[el.dataset.k].sla=Math.max(0,+el.value||0);if(e.type==='change'){toast('已儲存，時限已更新');renderNav()}return}
  if(k==='tymode'){TYPES[el.dataset.k].mode=el.value;toast('已儲存');return}
}

   <div class="aschips">${chips.map(c=>`<button class="cb" data-act="asq" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
  :`<div class="asnote">小助手需要「測試成功、已啟用」的 AI 才能使用。目前沒有，所以只顯示固定教學。</div>
   <div class="asmsg bot"><b>怎麼開始使用小助手</b><br>1. 到「AI 設定」，按「綁定新的 AI」<br>2. 貼上你自己的 AI 金鑰（小助手使用你自己的帳戶，費用算在你的 AI 供應商）<br>3. 若是自訂供應商，先按「測試連線」，成功後才會啟用<br>${role==='管理員'?'':'<br>只有管理員可以綁定 AI，請聯絡管理員。'}</div>
   ${role==='管理員'?`<button class="btn pri" data-act="nav" data-v="ai">前往 AI 設定</button>`:''}`;
  P.innerHTML=asHead()+`<div class="asbody" id="asmsgs">${body}</div>`+(k?`<div class="asin"><input type="text" id="asin" placeholder="想問什麼？例：怎麼連接 Instagram" aria-label="問小助手" autocomplete="off"><button class="btn pri" data-act="assend">送出</button></div>`:'');
  const mb=$('#asmsgs');if(mb)mb.scrollTop=mb.scrollHeight;
}
function asAnswer(q){
  const t=q.trim(),L=t.toLowerCase(),role=meRole(),admin=role==='管理員',pages=pageList();
  const go=(k,label)=>({t:'go',k,label:label||('前往「'+(PAGEDESC[k]||[k])[0]+'」')});
  // L3 一律拒絕
  if(/(刪除|移除|清空|砍掉)/.test(t)&&/(品牌|金鑰|成員|ai|帳號|留言|紀錄)/i.test(t))return{text:'這是我不能做的事（L3）：刪除類操作風險太高，我不會代替你執行。請你自己到對應頁面操作，系統會再請你二次確認。',cards:[]};
  if(/(替|幫|直接).*(送出|發送|發出|回覆).*(客人|客戶|留言|貼文)/.test(t)||/(自動|馬上).*(送出|回覆)/.test(t))return{text:'我不能幫你把回覆送給客人（L3）。我可以帶你到收件匣，由你檢查後自己按送出。',cards:[go('inbox')]};
  if(/(金鑰|密碼|token|api ?key).*(給我|顯示|看|告訴|是什麼)|(給我|顯示|看|告訴).*(金鑰|密碼|token|api ?key)/i.test(t))return{text:'金鑰一律不會顯示給任何人，包括我（L3）。畫面只會留最後 4 碼；需要的話請到 AI 供應商後台重新建立金鑰。',cards:[]};
  if(/(改|變成|升級|給我).*(管理員|權限|角色)/.test(t)&&!/怎麼|如何|什麼/.test(t))return{text:'我不能改變任何人的角色或權限（L3）。這要由管理員到「團隊成員」操作。',cards:admin?[go('team')]:[]};
  // 角色限制
  if(!admin&&/(綁定|新增|設定|換).*(ai|金鑰)|新增品牌|建立品牌|連接.*帳號.*(新增|授權)/i.test(t)&&!/怎麼|如何|什麼|哪/.test(t))return{text:`這件事只有「管理員」可以做，你目前的角色是「${role}」。需要的話請聯絡管理員；我可以先告訴你步驟，讓你轉給他。`,cards:[]};
  // L2 確認卡
  if(/(標記|設成|改成|標為).*(無需處理|不用處理)/.test(t)){const c=S.sel&&cm(S.sel);if(!c||!vis().includes(c))return{text:'請先到收件匣點開一則留言，我才知道要標哪一則。',cards:[go('inbox')]};
    return{text:'我已準備好這個動作，但需要你確認才會執行（L2）。',cards:[{t:'do',desc:`把「${c.u}：${c.text.slice(0,20)}」的狀態改成「無需處理」`,fn:()=>{c.status='無需處理';c.lock=null;logAdd(S.me,'AI 小助手代為執行（經確認）',`${c.u} → 無需處理`);render();return '已執行，並記錄在操作紀錄。'}}]}}
  if(/(切換|換).*(深色|淺色|主題|夜間)/.test(t))return{text:'這個動作需要你確認（L2）。',cards:[{t:'do',desc:'切換淺色／深色外觀',fn:()=>{ACT.theme();return '已切換。'}}]};
  // L1 預填（絕不送出）
  if(/(新增|建立).*品牌/.test(t))return{text:'我幫你打開新增品牌的問卷（L1）：只是開啟畫面，內容由你自己填寫、自己按「建立品牌」。',cards:[{t:'go',label:'打開新增品牌問卷',fn:()=>startWiz('new')}]};
  if(/(綁定|新增).*(ai|金鑰)/i.test(t)&&!/怎麼|如何/.test(t))return{text:'我幫你打開綁定視窗（L1）：金鑰請你自己貼上，我不會看到也不會代填。',cards:[{t:'go',label:'打開「綁定新的 AI」',fn:()=>{S.view='ai';render();ACT.aikeyadd()}}]};
  // L0 說明
  if(/連接.*(instagram|ig)|(instagram|ig).*連/i.test(t))return{text:'Instagram 連接步驟：①到「社群帳號連接」按「連接新的 IG 帳號」②選品牌並完成授權。限制：只有「商業帳號」或「創作者帳號」能連接，個人帳號需先在 Instagram 切換。\n目前狀態：連接流程是模擬的，真正連接需要 Meta 審核與客戶帳號，還沒完成。',cards:[go('ig')]};
  if(/(綁定|設定).*ai|ai.*(綁定|怎麼|金鑰)|金鑰/i.test(t))return{text:'綁定 AI：到「AI 設定」→「綁定新的 AI」→ 選供應商、貼上你自己的 API 金鑰、設定每月預算。可綁多隻，一隻主力、一隻備援。自訂供應商需要 https 位址並通過連線測試。金鑰只會顯示最後 4 碼。',cards:[go('ai')]};
  if(/還沒|未完成|不能用|真的|模擬|展示|限制|不支援/.test(t))return{text:'目前尚未真的完成的項目：\n・Instagram／Facebook／YouTube／Google 真實連接：尚未串接（Instagram 連接流程為模擬）\n・AI 回覆草稿：目前是示範文字，尚未呼叫真實 AI\n・社群洞察與留言：展示資料\n・送出回覆：只在工具內標記，沒有真的發到平台\n・Facebook 社團：目前不支援\n・廣告留言：需查證\n・我自己（小助手）：回答來自內建說明',cards:[go('ig')]};
  if(/角色|權限|可以做什麼|能做什麼/.test(t)){const d={管理員:'可以管理品牌、成員、社群帳號連接、AI 設定，並處理所有留言。',主管:'可以查看所有品牌數據、處理與轉交留言、使用一次回覆；不能改 AI 與帳號連接設定。',操作人員:'只能處理自己負責品牌的留言；一次回覆預設不能用，需管理員開放。'}[role];return{text:`你目前是「${role}」。${d}`+(pBrands().length?`\n你可以看到的品牌：${pBrands().map(b=>b.name).join('、')}。`:''),cards:[]}}
  if(/超時|時限|sla/i.test(t))return{text:'「首次回覆時限」是客人留言後要在多久內第一次回覆；快到時會變黃，超過會變紅。各類型的時限可到「規則設定」查看。',cards:[go('rules')]};
  if(/相似|一次回|批次/.test(t))return{text:'相似留言一次回：勾選留言 → 產生回覆 → 可逐則編輯 → 預覽 → 輸入「送出 N 則」確認。一次最多 20 則，送出的是你修改後的文字。',cards:[go('batch')]};
  if(/問卷/.test(t))return{text:'品牌問卷在「品牌管理」填寫。部分題目有「其他」可以自己寫（最多 200 字），之後都能回來修改。',cards:[go('brands')]};
  if(/你是誰|你是什麼|你會什麼|你能|可以幫/.test(t))return{text:'我是工具內的小助手：可以回答怎麼用、帶你去對應頁面、預先打開表單（不會自己送出）、經你確認後執行少數小動作。我不會送出回覆給客人、不會刪除東西、也看不到金鑰。',cards:[]};
  // 導覽
  if(/帶我|去|前往|打開|在哪|哪裡|怎麼找|開啟/.test(t)){const hit=pages.map(p=>({p,s:p.kw.split(/\s+/).filter(w=>w&&L.includes(w.toLowerCase())).length+(L.includes(p.n.toLowerCase())?3:0)})).sort((a,b)=>b.s-a.s)[0];
    if(hit&&hit.s>0)return{text:`「${hit.p.n}」：${hit.p.d[1]}。`,cards:[go(hit.p.k)]};}
  // 頁面關鍵字
  const hit=pages.map(p=>({p,s:p.kw.split(/\s+/).filter(w=>w&&L.includes(w.toLowerCase())).length})).sort((a,b)=>b.s-a.s)[0];
  if(hit&&hit.s>0)return{text:`你可能在找「${hit.p.n}」：${hit.p.d[1]}。`,cards:[go(hit.p.k)]};
  return{text:'這個問題我還答不出來。你可以問我：怎麼連接 Instagram、怎麼綁定 AI、哪些功能還沒做好、我的角色可以做什麼，或說「帶我去○○」。',cards:[]};
}
function asSend(q){q=String(q||'').trim().slice(0,200);if(!q)return;asAdd('user',q);const r=asAnswer(q);asAdd('bot',r.text,r.cards)}
(function(){
  const b=document.createElement('button');b.id='asBtn';b.setAttribute('data-act','asopen');b.setAttribute('aria-label','開啟 AI 小助手');b.innerHTML='<span aria-hidden="true">✦</span><span class="astx">小助手</span>';document.body.appendChild(b);
  const p=document.createElement('aside');p.id='asPanel';p.setAttribute('aria-label','AI 小助手');p.style.display='none';document.body.appendChild(p);
})();
Object.assign(ACT,{
 asopen(){S.as.open=true;asRender();const i=$('#asin');if(i)i.focus()},
 asclose(){S.as.open=false;asRender()},
 asq(el){asSend(el.dataset.q)},
 assend(){const i=$('#asin');if(!i)return;const v=i.value;i.value='';asSend(v)},
 asgo(el){const c=S.as.msgs[+el.dataset.i].cards[+el.dataset.j];if(c.fn){c.fn()}else{S.view=c.k;S.modal=null;S.open=false;render()}if(innerWidth<640){S.as.open=false;asRender()}},
 asdo(el){const c=S.as.msgs[+el.dataset.i].cards[+el.dataset.j];if(c.done)return;c.done=c.fn();asRender()},
 ascancel(el){const c=S.as.msgs[+el.dataset.i].cards[+el.dataset.j];c.done='已取消，沒有執行任何動作。';asRender()}
});
document.addEventListener('keydown',e=>{if(e.target.id==='asin'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();ACT.assend()}});

S.sel=6;
render();
setInterval(()=>{if(S.view==='inbox'&&!S.modal)refreshLive();else if(['dash','home'].includes(S.view)&&!S.modal)render()},30000);
</script>
